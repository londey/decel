[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/londey/decel"
homepage = "https://github.com/londey/decel"
authors = ["Nicholas Londey"]
rust-version = "1.99"

[workspace.dependencies]
# Internal crates (published in lockstep; version required for crates.io).
decel-model = { path = "crates/decel-model", version = "=0.1.0" }
decel-store = { path = "crates/decel-store", version = "=0.1.0" }
decel-engine = { path = "crates/decel-engine", version = "=0.1.0" }
decel-io = { path = "crates/decel-io", version = "=0.1.0" }

# GPUI: exact pins. gpui-component pins gpui-pre exactly; keep them in step (DESIGN §10.2).
gpui-component = { version = "=0.9.0", default-features = false }
gpui = { package = "gpui-pre", version = "=0.3.11" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.11", features = ["font-kit", "wayland", "x11"] }

mlua = { version = "0.12.2", features = ["lua54", "vendored", "send"] }
thiserror = "2"
anyhow = "1"
blake3 = "1.8"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
rstar = "0.14"
crossbeam-channel = "0.5"
csv = "1.4"
toml = "1.1"
directories = "6"
tracing = "0.1"
futures = "0.3.34"

# Dev / test
proptest = "1.12"
tempfile = "3.27"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
